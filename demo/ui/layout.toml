# Layout UI du projet (uigen — docs/SPEC_SYSTEME_UI.md §3 + widgets W1).
# Positions et tailles EN TILES (unités de 8 px, écran 32x28).
# Sans ce fichier : boîte historique en bas, pleine largeur.

[message]          # fenêtre des dialogues
pos = [0, 20]
size = [32, 8]

[choice]           # fenêtre des choix (défaut : comme message)
pos = [0, 20]
size = [32, 8]

# ---- Widgets PERMANENTS (8 max, placement libre — jamais sous les ----
# fenêtres message/choice). La planche d'icônes du projet
# (assets/icons.png, Gestionnaire de ressources → IconSet) fournit :
#   0-2 cœur plein/demi/vide   3-5 jauge pleine/demie/vide
#   6 rubis                    7 bombe
# Décommenter un bloc, choisir la variable, Générer, jouer.
# visible = true : affiché dès le boot — sans lui, un widget est CACHÉ
# jusqu'à la commande d'event « Afficher un widget UI ».

# Points de vie façon Zelda : var 6 sur un max de 12 (2 PV par cœur)
# [[overlay]]
# id = "vie"
# visible = true
# pos = [1, 0]
# size = [6, 1]
# content = "icon_row"
# var = 6
# max = 12
# icon = 0
# frame = false

# Jauge de magie verticale (remplie par le bas, façon ALttP)
# [[overlay]]
# id = "magie"
# visible = true
# pos = [1, 2]
# size = [1, 6]
# content = "gauge"
# var = 7
# max = 100
# icon = 3
# dir = "v"
# frame = false

# Compteur de rubis avec zéros de tête (072)
# [[overlay]]
# id = "rubis"
# visible = true
# pos = [26, 0]
# size = [5, 1]
# content = "icon_value"
# var = 8
# icon = 6
# pad = 3
# frame = false

# Fenêtre cadrée « libellé + valeur » (style RM2003)
# [[overlay]]
# id = "quete"
# visible = true
# pos = [8, 0]
# size = [12, 3]
# content = "variable_display"
# var = 5
# label = "Fleurs"

# Menu de combat (B6) : liste à curseur — CACHÉ au boot, ouvert par la
# commande d'event « Choix dans une liste » (index -> variable, B = 255)
[[node]]
id = "menu_combat"
type = "list"
pos = [2, 2]
items = ["Attaque", "Magie", "Objet", "Fuite"]
