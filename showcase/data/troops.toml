# Groupes de monstres (C1) — les stats et le battler de chaque monstre
# viennent de la table `monsters` de la database ; le groupe ARRANGE.
# x, y en tiles d'écran (32x28).

[[troop]]
id = "gobelins"
backdrop = "fond_prairie"
# Hooks (C4) : des common events joues par le moteur — l'ATB attend.
intro = "intro_gobelins"
low_hp = "gobelins_blesses"
monsters = [
  { id = "gobelin", x = 4, y = 5 },
  { id = "gobelin", x = 8, y = 8 },
]

[[troop]]
id = "dragon_seul"
backdrop = "fond_prairie"
# V2 : l'intro EST le combat — la bibliotheque (common event combat_tour)
intro = "combat_tour"
monsters = [ { id = "dragon", x = 5, y = 6 } ]
