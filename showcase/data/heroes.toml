# L'équipe (C1) — format fixe lu par datagen (module battle).
# L'ordre est l'ordre d'affichage à droite de l'écran de combat.
# `menu` : le widget liste à curseur du layout qui sert de menu de combat.
menu = "menu_combat"
# Le SENS de chaque entrée du menu (alignées sur les items du widget).
actions = ["attack", "skill:eclair", "skill:soin", "flee"]

[[hero]]
id = "arven"
name = "Arven"
charset = "Heros"
max_hp = 300
max_mp = 40
speed = 60
attack = 12
defense = 4
magic = 6
magic_def = 6

